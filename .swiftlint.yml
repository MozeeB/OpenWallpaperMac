included:
  - Sources
  - App
  - Tests
  - UITests
excluded:
  - .build
  - build
disabled_rules:
  - todo
  - identifier_name
  - trailing_comma
  - opening_brace
  - nesting
  - type_name
opt_in_rules:
  - force_unwrapping
  - empty_count
  - first_where
  - contains_over_first_not_nil
line_length:
  warning: 140
  error: 200
  ignores_comments: true
function_body_length:
  warning: 50
  error: 80
file_length:
  warning: 400
  error: 800
type_body_length:
  warning: 300
  error: 500
cyclomatic_complexity:
  warning: 12
  error: 20
large_tuple:
  warning: 3
force_unwrapping:
  severity: warning
function_parameter_count:
  warning: 6
  error: 8
custom_rules:
  no_print_in_libraries:
    included: "Sources/OW.*"
    regex: "^\\s*print\\("
    message: "Libraries must not print; return errors or use os.Logger."
    severity: error

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'  # Swift 6.2+ SDK required; never fall back to the 16.x default
      - name: Lint
        run: brew install swiftlint && swiftlint lint --strict --quiet
      - name: Release version calculator tests
        run: scripts/release/test-next-version.sh
      - name: Unit & integration tests with coverage
        run: swift test --enable-code-coverage
      - name: Coverage gate (80% per module)
        run: scripts/coverage-gate.sh
      - name: CLI end-to-end
        run: |
          swift build -c release --product owctl
          OUT=$(mktemp -d)
          .build/release/owctl make-sample "$OUT"
          .build/release/owctl validate "$OUT/Plasma" "$OUT/Synthetic Scene"
          .build/release/owctl render "$OUT/Synthetic Scene" --out "$OUT/scene.png" --width 320 --height 180

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'  # Swift 6.2+ SDK required; never fall back to the 16.x default
      - name: Build DMG (ad-hoc signed)
        run: |
          brew install xcodegen
          scripts/release/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWallpaperMac-ci-dmg
          path: dist/*.dmg
          retention-days: 7

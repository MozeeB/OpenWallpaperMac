name: Release

# Push a tag like `v0.2.0` to test, build the DMG, generate release notes and publish a GitHub Release.
# Manual runs (workflow_dispatch) build the DMG as a downloadable artifact without publishing.
#
# Optional repository secrets for a signed + notarized build (otherwise the DMG is ad-hoc signed):
#   MACOS_CERTIFICATE           base64 of a Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   DEVELOPER_ID                e.g. "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_KEY                  base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID, NOTARY_ISSUER

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.2.0)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for release notes

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'  # Swift 6.2+ SDK required; never fall back to the 16.x default

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION:-$(awk -F'"' '/MARKETING_VERSION/ { print $2; exit }' project.yml)-dev}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Install tools
        run: brew install xcodegen

      - name: Test
        run: swift test

      - name: Import signing certificate
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            echo "No signing certificate configured; building ad-hoc signed DMG."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          if [[ -n "$NOTARY_KEY" ]]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "notary_key_path=$RUNNER_TEMP/notary.p8" >> "$GITHUB_OUTPUT"
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPER_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.DEVELOPER_ID || '' }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.notary_key_path }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          scripts/release/make-dmg.sh
          echo "path=dist/OpenWallpaperMac-$VERSION.dmg" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          FLAG=""
          [[ "${{ steps.signing.outputs.signed }}" == "true" && -n "${{ secrets.NOTARY_KEY }}" ]] && FLAG="--signed"
          TAG="${GITHUB_REF_TYPE/tag/$GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || TAG=HEAD
          scripts/release/release-notes.sh "$TAG" $FLAG > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWallpaperMac-${{ steps.version.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 \
            --title "OpenWallpaperMac ${{ steps.version.outputs.version }}" \
            --notes-file dist/RELEASE_NOTES.md $PRERELEASE

      - name: Clean up keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
